name: Publish to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Containerfile
      - entrypoint.sh
      - supervisord.conf
      - .github/workflows/publish-ghcr.yml
  workflow_dispatch:

# GITHUB_TOKEN needs to be allowed to publish packages.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Must be lowercase: GHCR rejects uppercase repository paths.
  IMAGE_NAME: tgodfrey0/aice2011_container

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          # push-by-digest means no tags here: each arch lands as an
          # untagged manifest that the merge job joins into one list.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=AICE2011 ROS 2 + Gazebo Container Lab
            org.opencontainers.image.description=ROS 2 Jazzy, Gazebo Sim (Harmonic) and TurtleBot3 on an XFCE4 desktop reachable over noVNC.
            org.opencontainers.image.source=https://github.com/tgodfrey0/AICE2011_Container
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch manifest
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list and push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -eu
          # Without this an empty directory leaves the glob unexpanded and
          # imagetools would be handed a literal "*" reference.
          shopt -s nullglob

          tags=(-t "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA::8}")

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags+=(-t "$REGISTRY/$IMAGE_NAME:latest")
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=(-t "$REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME")
          fi

          sources=()
          for digest in /tmp/digests/*; do
            sources+=("$REGISTRY/$IMAGE_NAME@$(basename "$digest")")
          done

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No digests found in /tmp/digests" >&2
            exit 1
          fi

          echo "Publishing $REGISTRY/$IMAGE_NAME"
          printf '  %s\n' "${sources[@]}"

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect published manifest
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA::8}"
