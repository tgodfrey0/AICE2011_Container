[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
priority=10
autorestart=true

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbport 5900 -nopw
priority=20
autorestart=true

[program:openbox]
command=openbox-session
environment=DISPLAY=":1",HOME="/home/student",USER="student"
user=student
priority=30
autorestart=true

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 --web /usr/share/novnc
autorestart=true
priority=40
