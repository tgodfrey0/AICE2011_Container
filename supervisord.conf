[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
priority=10
autorestart=true

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile --address=unix:path=/tmp/runtime-student/bus
environment=HOME="/home/student",USER="student",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-student/bus"
user=student
priority=15
autorestart=true

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbport 5900 -nopw
priority=20
autorestart=true

# Openbox stays the window manager. Xfce's panel runs alongside it rather than
# as a full xfce4-session, which is lighter and keeps the session restartable on
# its own. It needs the session bus above, so it is given the same fixed address
# rather than launching its own.
#
# xfdesktop is deliberately not started: it exists to draw desktop icons, and
# the desktop background is already set by xsetroot in the Openbox autostart.
# Leaving it out keeps the desktop completely clear of icons.
[program:openbox]
command=openbox-session
environment=DISPLAY=":1",HOME="/home/student",USER="student",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-student/bus"
user=student
priority=30
autorestart=true

[program:xfce4-panel]
command=/usr/bin/xfce4-panel --disable-wm-check
environment=DISPLAY=":1",HOME="/home/student",USER="student",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-student/bus",XDG_RUNTIME_DIR="/tmp/runtime-student"
user=student
priority=32
autorestart=true
startsecs=3

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 --web /usr/share/novnc
autorestart=true
priority=40
