[supervisord]
nodaemon=true
user=root

# TigerVNC's Xvnc is both the X server and the VNC server, so it replaces the
# Xvfb and x11vnc programs this file used to run.
#
# The clipboard flags are the whole point of the swap. -SendCutText pushes
# selection changes out to the browser, -AcceptCutText takes them in, and
# between them TigerVNC negotiates the Extended Clipboard pseudo-encoding,
# which is what makes UTF-8 survive the trip. x11vnc on Ubuntu 24.04 cannot
# parse those messages because it ships libvncserver 0.9.14.
#
# -localhost keeps port 5900 reachable only from inside the container, so the
# only way in is via noVNC's websockify proxy. Nothing outside the container
# needs raw VNC. The earlier x11vnc invocation had no such restriction.
# -nolisten tcp additionally stops Xtigervnc opening the X11 port 6001, which
# would otherwise be a way to bypass all of this.
[program:xtigervnc]
command=/usr/bin/Xtigervnc :1 -geometry 1920x1080 -depth 24 -rfbport 5900 -localhost -AlwaysShared -SendCutText -AcceptCutText -SecurityTypes None -nolisten tcp
environment=HOME="/home/student",USER="student"
user=student
priority=10
autorestart=true
startsecs=3

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile --address=unix:path=/tmp/runtime-student/bus
environment=HOME="/home/student",USER="student",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-student/bus"
user=student
priority=15
autorestart=true

# Openbox stays the window manager. Xfce's panel runs alongside it rather than
# as a full xfce4-session, which is lighter and keeps the session restartable on
# its own. It needs the session bus above, so it is given the same fixed address
# rather than launching its own.
#
# xfdesktop is deliberately not started: it exists to draw desktop icons, and
# the desktop background is already set by Xtigervnc. Leaving it out keeps the
# desktop completely clear of icons.
[program:openbox]
command=openbox-session
environment=DISPLAY=":1",HOME="/home/student",USER="student",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-student/bus"
user=student
priority=30
autorestart=true

[program:xfce4-panel]
command=/usr/bin/xfce4-panel --disable-wm-check
environment=DISPLAY=":1",HOME="/home/student",USER="student",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-student/bus",XDG_RUNTIME_DIR="/tmp/runtime-student"
user=student
priority=32
autorestart=true
startsecs=3

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 --web /usr/share/novnc
autorestart=true
priority=40