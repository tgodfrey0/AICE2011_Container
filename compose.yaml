# AICE2011 -- ROS 2 Jazzy + Gazebo Sim (Harmonic) + TurtleBot3 lab
#
# Start the lab:
#
#     docker compose up -d
#
# then open this in your browser:
#
#     http://127.0.0.1:6080/vnc.html?autoconnect=true
#
# Stop it again with:  docker compose down
#
# Paths and ports come from .env next to this file -- that is the only file
# you should need to edit. See .env for what to put in it.

services:
  ros2-gazebo-lab:
    # image: ghcr.io/tgodfrey0/aice2011_container:latest
    # container_name: ros_lab_test

    ports:
      - "127.0.0.1:${VNC_PORT:-6080}:6080"

    volumes:
      # Your work lives on your machine, not inside the container, so it
      # survives `docker compose down` and `docker compose rm`.
      - type: bind
        source: ${ROS2_WS:-./ros2_ws}
        target: /home/student/ros2_ws
        bind:
          create_host_path: true

    # To build the image from the Containerfile in this folder instead of
    # pulling it, comment out `image:` above and uncomment these lines:
    build:
      context: .
      file: Containerfile
